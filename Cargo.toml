[package]
name = "lsx"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "List the regular files in a directory, grouped by extension"
license = "MIT"
repository = "https://github.com/mikemadden42/lsx"
readme = "README.md"
keywords = ["ls", "files", "extension", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]

[lints.clippy]
# Enforced in CI (warnings are errors there). Priority -1 lets individual
# lints be overridden below the group if ever needed.
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
